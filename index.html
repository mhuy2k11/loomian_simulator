<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loomian Battle Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="battle-container">
  <div class="back-btn" id="back-btn">≪</div>

  <div class="battlefield">
    <!-- Enemy side (trái) -->
    <div class="side" id="enemy-side">
      <div class="info">
        <div class="name-level" id="enemy-name">Left</div>
        <div class="hp-bar"><div class="hp-inner" id="enemy-hp-bar"></div></div>
        <div class="hp-text" id="enemy-hp-text">150/150</div>
      </div>
    </div>

    <!-- Player side (phải) -->
    <div class="side" id="player-side">
      <div class="info">
        <div class="name-level" id="player-name">Right</div>
        <div class="hp-bar"><div class="hp-inner" id="player-hp-bar"></div></div>
        <div class="hp-text" id="player-hp-text">100/100</div>
      </div>
    </div>
  </div>

  <div class="battle-log" id="log">Trận đấu bắt đầu!</div>

  <div class="action-menu" id="move-menu">
    <!-- Moves sẽ được JS tạo động -->
  </div>
</div>

<script src="data/data.js"></script>
<script src="js/PRNG.js"></script>
<script src="js/main2.js"></script>


</body>
</html>
